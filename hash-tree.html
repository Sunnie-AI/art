<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; }

  #search-panel {

    border-top: none; border-radius: 0 0 4px 4px; max-height: 240px;
    overflow-y: auto; display: none; position: relative; z-index: 5;
  }
  .search-item {
    padding: 5px 10px; color: rgba(255,170,68,0.7); font: 12px monospace;

  }
  .search-item:hover, .search-item.active { background: rgba(255,170,68,0.12); color: #ffcc66; }
  .search-item .sats { color: rgba(255,170,68,0.35); font-size: 10px; }
  .search-item.sunnie-item { color: rgba(34,204,170,0.8); }

  #selected-info {
    color: rgba(255,170,68,0.7); font: 11px monospace;
    background: rgba(0,0,0,0.5); padding: 8px 12px;
    border-radius: 4px; display: none;
    margin-top: 8px; line-height: 1.5;
  }
  #selected-info .name { color: #ffcc66; font-size: 13px; }
  #selected-info .sunnie-name { color: #66ffd8; }
  #controls {
    position: absolute; bottom: 20px; right: 16px;
    z-index: 20; display: flex; align-items: center; gap: 14px;
  }
  #controls label { color: rgba(255,170,68,0.3); font: 10px monospace; }
  #speed-slider {
    width: 80px; accent-color: #ffaa44; opacity: 0.5;
  }
  #speed-slider:hover { opacity: 0.8; }
  .toggle-btn {
    background: none; border: 1px solid rgba(255,170,68,0.2);
    color: rgba(255,170,68,0.4); font: 10px monospace;
    padding: 3px 8px; border-radius: 3px; cursor: pointer;
  }
  .toggle-btn:hover { border-color: rgba(255,170,68,0.5); color: rgba(255,170,68,0.7); }
  .toggle-btn.active { border-color: rgba(255,170,68,0.5); color: rgba(255,170,68,0.7); }

// ─── HASH → PARAMS ───
function hashToParams(hash) {
  const h = hash.replace(/^0+/, '');
  const b = [];
  for (let i = 0; i < Math.min(h.length, 48); i += 2)
    b.push(parseInt(h.substr(i, 2), 16));
  while (b.length < 24) b.push(128);
  return {
    angle0: (b[0]/255) * Math.PI * 2,
    curl:   (b[1]/255 - 0.5) * 0.1,
    upBias: 0.12 + 0.2 * b[2]/255,
    jitter: 0.015 + 0.05 * b[3]/255,
    sway:   0.5 + 0.5 * b[4]/255,
    seeds:  b.slice(5),
  };
}

// ─── TREE BUILDER ───
function buildTree(hp) {
  const segs = [], lvs = [], gpts = [], conns = [];
  const userTips = {}; // store branch tip positions per user
  let order = 0;

  // Trunk — grows upward from the ground over time
  const tSegs = 24;
  const trunkBase = new THREE.Vector3(0, 0, 0);
  for (let i = 0; i < tSegs; i++) {
    const t = i / tSegs, t1 = (i+1) / tSegs;
    const sx0 = Math.sin(t  * Math.PI*2) * hp.curl * 3 * t;
    const sz0 = Math.cos(t  * Math.PI*1.5) * hp.curl * 2 * t;
    const sx1 = Math.sin(t1 * Math.PI*2) * hp.curl * 3 * t1;
    const sz1 = Math.cos(t1 * Math.PI*1.5) * hp.curl * 2 * t1;
    const s = new THREE.Vector3(sx0, t * TRUNK_H, sz0);
    const e = new THREE.Vector3(sx1, t1 * TRUNK_H, sz1);
    const growth = TC_GROWTH[Math.min(i, TC_GROWTH.length - 1)];
    const th = 0.06 + 0.65 * Math.sqrt(growth);
    // Each trunk segment grows sequentially from bottom to top
    const trunkGT = t * TRUNK_GROW;
    segs.push({ s, e, bo: trunkBase, d:0, o:0, th, si:t, sun:false, gt: trunkGT });
    gpts.push({ p: e.clone(), bo: trunkBase, d:0, o:0, sz: th * 1.3, sun:false, gt: trunkGT });
  }
  order = 1;

  // Branch helper
  function branch(orig, dir, len, thick, depth, isSun, userData, subI, parentEndGT, userIdx) {
    if (depth > MAX_SUB || len < 0.2) return;
    const nSeg = Math.max(3, 6 - depth);
    const segL = len / nSeg;
    let pos = orig.clone();
    let d = dir.clone().normalize();
    const ord = order++;
    const si = (ord * 7 + subI * 13) % hp.seeds.length;
    const seed = hp.seeds[si] / 255;
    // growStart: either from parent's end time, or calculated from user data
    let growStart;
    if (parentEndGT !== undefined) {
      // Sub-branch: start after parent finishes
      growStart = parentEndGT;
    } else if (userData) {
      const userT = (new Date(userData.s) - GENESIS) / 86400000 / TOTAL_DAYS;
      const trunkReady = (userData._hRatio ?? 0.5) * TRUNK_GROW;
      growStart = Math.max(trunkReady + 0.02, userT * 0.75);
    } else {
      growStart = 0.5;
    }

    const branchOrigin = orig.clone();

    // Each segment grows sequentially
    let lastSegGT = growStart;
    for (let i = 0; i < nSeg; i++) {
      const next = pos.clone().add(d.clone().multiplyScalar(segL));
      const jS = depth > 0 ? 1.0 : 0.3;
      next.x += Math.sin(seed*100 + i*1.7 + ord*0.3) * hp.jitter * jS;
      next.z += Math.cos(seed*77  + i*2.3 + ord*0.5) * hp.jitter * jS;
      next.y += segL * hp.upBias * (depth < 2 ? 0.6 : 0.2);
      if (depth >= 2) next.y -= 0.006 * depth;

      const segGT = growStart + (i/nSeg) * 0.05;
      lastSegGT = segGT;

      segs.push({
        s: pos.clone(), e: next.clone(),
        bo: branchOrigin,
        d: depth, o: ord, th: thick,
        si: i/nSeg, sun: isSun,
        gt: segGT, ui: userIdx ?? -1,
      });
      gpts.push({
        p: next.clone(), d: depth, o: ord,
        sz: thick * 1.2, sun: isSun,
        gt: segGT, ui: userIdx ?? -1,
        bo: branchOrigin,
      });
      pos = next;
      d = next.clone().sub(segs[segs.length-1].s).normalize();
    }

    // Store tip position for user branches
    if (userData) userTips[userData.n] = pos.clone();

    // Time when THIS branch finishes — children start after this
    const branchEndGT = lastSegGT + 0.03;

    // Sub-branches — start AFTER parent branch finishes
    if (depth < MAX_SUB) {
      let nSub;
      if (userData) {
        const eCnt = TC_EDGES.filter(e =>
          e[0] === userData.n || e[1] === userData.n
        ).length;
        nSub = Math.min(5, Math.max(2, Math.floor(eCnt / 3)));
      } else {
        nSub = Math.max(2, 4 - depth);
      }
      for (let i = 0; i < nSub; i++) {
        const a = Math.atan2(d.z, d.x) + (i-(nSub-1)/2) * (0.4 + seed*0.25);
        const sd = new THREE.Vector3(
          Math.cos(a), 0.06 + 0.14*seed, Math.sin(a)
        ).normalize();
        // Pass branchEndGT so children start after parent
        branch(pos.clone(), sd, len*(0.32+0.15*seed),
               thick*0.5, depth+1, isSun, null, i, branchEndGT, userIdx);
      }
    }

    // Leaves — appear AFTER this branch finishes
    const nL = userData
      ? Math.max(5, Math.floor(userData.a / 2.5))
      : (depth >= MAX_SUB - 1 ? 4 : 1);
    const spread = 0.8 + depth * 0.35;
    for (let i = 0; i < nL; i++) {
      lvs.push({
        p: pos.clone().add(new THREE.Vector3(
          (Math.random()-0.5)*spread,
          Math.random()*spread*0.5,
          (Math.random()-0.5)*spread
        )),
        o: ord, ph: Math.random(), sun: isSun,
        gt: branchEndGT + 0.02, ui: userIdx ?? -1,
      });
    }

    // Bloom orb at branch tip — sized by tips received
    if (userData) {
      const tipSats = TC_TIPS[userData.n] || 0;
      if (tipSats > 0) {
        const tipLinear = tipSats / MAX_TIPS;
        const bloomSize = thick * 1.5 + Math.sqrt(tipLinear) * 1.2;
        // Central bloom point
        gpts.push({
          p: pos.clone(), d: depth, o: ord,
          sz: bloomSize, sun: isSun,
          gt: branchEndGT + 0.01, ui: userIdx ?? -1,
          bo: pos.clone(),
        });
        // Extra leaf particles for high-tip users
        const bonusLeaves = Math.floor(Math.sqrt(tipLinear) * 10);
        for (let i = 0; i < bonusLeaves; i++) {
          lvs.push({
            p: pos.clone().add(new THREE.Vector3(
              (Math.random()-0.5)*spread*0.6,
              Math.random()*spread*0.3,
              (Math.random()-0.5)*spread*0.6
            )),
            o: ord, ph: Math.random(), sun: isSun,
            gt: branchEndGT + 0.03, ui: userIdx ?? -1,
          });
        }
      }
    }
  }

  // Build user branches
  TC_USERS.forEach((u, idx) => {
    const days = (new Date(u.s) - GENESIS) / 86400000;
    const hRatio = Math.max(0.06, Math.min(0.95, days / TOTAL_DAYS));
    u._hRatio = hRatio; // store for branch growBase calculation
    const y = hRatio * TRUNK_H;
    const angle = hp.angle0 + idx * GOLDEN;
    const pr = u.p / MAX_POSTS;
    const isSun = u.n === 'Sunnie';
    // Blend post count and tip weight for branch sizing
    const tipSats = TC_TIPS[u.n] || 0;
    const tipNorm = Math.log1p(tipSats) / Math.log1p(MAX_TIPS);
    const blended = pr * 0.4 + tipNorm * 0.6; // tips weigh more than posts
    const len = isSun ? 7 : (4 + 10 * Math.sqrt(blended));
    const thick = isSun ? 0.15 : (0.06 + 0.35 * Math.sqrt(blended));

    const t = hRatio;
    const ox = Math.sin(t * Math.PI*2) * hp.curl * 3 * t;
    const oz = Math.cos(t * Math.PI*1.5) * hp.curl * 2 * t;
    const origin = new THREE.Vector3(ox, y, oz);

    // More horizontal spread — less upward bias
    const upB = hp.upBias * (0.7 - pr * 0.3);
    const dir = new THREE.Vector3(
      Math.cos(angle), upB, Math.sin(angle)
    ).normalize();

    branch(origin, dir, len, thick, 1, isSun, u, 0, undefined, idx);
  });

  // ── ROOT SYSTEM — top givers grow downward from trunk base ──
  TC_GIVERS.forEach((g, gIdx) => {
    const givenLinear = g.g / MAX_GIVEN; // linear for length — preserves real differences
    const givenLog = Math.log1p(g.g) / Math.log1p(MAX_GIVEN); // log for thickness
    const angle = hp.angle0 + gIdx * GOLDEN + Math.PI * 0.7;
    const isSun = g.n === 'Sunnie';
    const seed = hp.seeds[gIdx % hp.seeds.length] / 255;
    const seed2 = hp.seeds[(gIdx * 7 + 3) % hp.seeds.length] / 255;

    // sqrt(linear) for length — 63 BSV root is 4x longer than 0.6 BSV root
    const rootLen = 3 + 14 * Math.sqrt(givenLinear);
    const rootThick = 0.04 + 0.3 * Math.sqrt(givenLog);

    // Varied initial angles — some spread wide, some dive deep
    // Each root has a unique character from its seed
    const spreadAmount = 0.5 + seed * 0.5; // 0.5–1.0 horizontal spread
    const diveAmount = 0.3 + seed2 * 0.4;  // 0.3–0.7 downward pull
    const rootOrigin = new THREE.Vector3(0, 0, 0);
    const rootDir = new THREE.Vector3(
      Math.cos(angle) * spreadAmount,
      -diveAmount,
      Math.sin(angle) * spreadAmount
    ).normalize();

    const rootGrowBase = 0.05 + gIdx * 0.008;
    const rootUserIdx = ROOT_OFFSET + gIdx;

    // More segments for longer roots — smoother curves
    const nSeg = Math.max(6, Math.floor(rootLen * 1.2));
    const segL = rootLen / nSeg;
    let pos = rootOrigin.clone();
    let d = rootDir.clone();

    for (let i = 0; i < nSeg; i++) {
      const t = i / nSeg;
      const next = pos.clone().add(d.clone().multiplyScalar(segL));

      // Organic wandering — roots aren't straight, they seek
      const wanderScale = 0.12 + givenLog * 0.08;
      next.x += Math.sin(seed * 80 + i * 1.9 + gIdx * 3.7) * wanderScale;
      next.z += Math.cos(seed * 60 + i * 2.3 + gIdx * 2.1) * wanderScale;

      // Gradually curve more downward as root extends
      next.y -= 0.04 * t * t * rootLen;

      // Taper thickness toward tip
      const taper = 1 - t * 0.6;

      const segGT = rootGrowBase + t * 0.08;
      segs.push({
        s: pos.clone(), e: next.clone(),
        bo: rootOrigin, d: 1, o: gIdx, th: rootThick * taper,
        si: t, sun: isSun, gt: segGT, ui: rootUserIdx, root: true,
      });
      gpts.push({
        p: next.clone(), d: 1, o: gIdx, sz: rootThick * taper * 0.8,
        sun: isSun, gt: segGT, ui: rootUserIdx, bo: rootOrigin, root: true,
      });
      pos = next;

      // Update direction with slight pull toward original heading + downward
      const newD = next.clone().sub(segs[segs.length-1].s).normalize();
      // Blend current direction with gravity pull
      d.lerp(newD, 0.6);
      d.y -= 0.02; // gentle gravity
      d.normalize();
    }

    // Root tip particles — more for bigger givers
    const rootTipGT = rootGrowBase + 0.1;
    const tipCount = Math.max(4, Math.floor(givenLinear * 15 + 3));
    for (let i = 0; i < tipCount; i++) {
      lvs.push({
        p: pos.clone().add(new THREE.Vector3(
          (Math.random()-0.5)*0.8,
          -Math.random()*0.5,
          (Math.random()-0.5)*0.8
        )),
        o: gIdx, ph: Math.random(), sun: isSun,
        gt: rootTipGT, ui: rootUserIdx, root: true,
      });
    }

    userTips[g.n + '_root'] = pos.clone();
  });

  // Build connection arcs as line segments for flowing dash effect
  const maxReplies = Math.max(...TC_EDGES.map(e => e[2]));
  for (const [from, to, replies, firstDate] of TC_EDGES) {
    const pA = userTips[from], pB = userTips[to];
    if (!pA || !pB) continue;
    // Skip system account — not a genuine social connection
    if (from === 'treechat' || to === 'treechat') continue;
    const isSunEdge = from === 'Sunnie' || to === 'Sunnie';
    // Log scale to prevent single edge from dominating
    const weight = Math.log(1 + replies) / Math.log(1 + maxReplies);
    // Show top connections by weight + all Sunnie edges
    if (weight < 0.4 && !isSunEdge) continue;

    const edgeDays = firstDate
      ? (new Date(firstDate) - GENESIS) / 86400000
      : TOTAL_DAYS * 0.5;
    const edgeGrowTime = Math.max(0.05, edgeDays / TOTAL_DAYS) * 0.85;

    // Quadratic bezier arc
    const mid = pA.clone().add(pB).multiplyScalar(0.5);
    mid.y += 1.0 + 1.5 * weight;
    const arcSegs = 16;
    for (let i = 0; i < arcSegs; i++) {
      const t0 = i / arcSegs, t1 = (i+1) / arcSegs;
      const bezier = (t) => new THREE.Vector3(
        (1-t)*(1-t)*pA.x + 2*(1-t)*t*mid.x + t*t*pB.x,
        (1-t)*(1-t)*pA.y + 2*(1-t)*t*mid.y + t*t*pB.y,
        (1-t)*(1-t)*pA.z + 2*(1-t)*t*mid.z + t*t*pB.z,
      );
      conns.push({
        s: bezier(t0), e: bezier(t1),
        t0, t1, w: weight, sun: isSunEdge, gt: edgeGrowTime
      });
    }
  }

  return { segs, lvs, gpts, conns };
}

camera.position.set(0, 10, 48);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.15;
controls.target.set(0, 9, 0);
controls.minDistance = 8;
controls.maxDistance = 60;

// ─── SHADERS ───
const lineVert = `
  attribute float aDepth;
  attribute float aGrowTime;
  attribute float aIsEnd;
  attribute float aIsSunnie;
  attribute float aUserIdx;
  attribute float aIsRoot;
  attribute float aTrunkT;
  attribute vec3 aStartPos;
  uniform float uTime;
  uniform float uGrowth;
  uniform float uSelectedUser;
  uniform float uSelectedRoot;
  uniform float uTrunkGlowMax;
  varying float vDepth;
  varying float vGrow;
  varying float vFog;
  varying float vSunnie;
  varying float vSelected;
  varying float vRoot;
  varying float vTrunkT;

  void main() {
    float segGrow = clamp((uGrowth - aGrowTime) / 0.04, 0.0, 1.0);
    vGrow = segGrow;
    vDepth = aDepth;
    vSunnie = aIsSunnie;
    vRoot = aIsRoot;
    vTrunkT = aTrunkT;
    vSelected = ((uSelectedUser >= 0.0 && abs(aUserIdx - uSelectedUser) < 0.5) ||
                 (uSelectedRoot >= 0.0 && abs(aUserIdx - uSelectedRoot) < 0.5)) ? 1.0 : 0.0;

    // Both start and end vertices grow outward from branch origin
    vec3 pos = mix(aStartPos, position, segGrow);

    float swayAmt = aDepth / 8.0 * 0.2 * segGrow;
    pos.x += sin(uTime * 0.6 + pos.y * 0.3) * swayAmt;
    pos.z += cos(uTime * 0.4 + pos.y * 0.25) * swayAmt * 0.5;

    if (uGrowth < aGrowTime - 0.02) pos = aStartPos;

    vec4 mv = modelViewMatrix * vec4(pos, 1.0);
    vFog = smoothstep(80.0, 10.0, -mv.z);
    gl_Position = projectionMatrix * mv;
  }
`;

const lineFrag = `
  uniform float uTime;
  uniform float uSelectedUser;
  uniform float uTrunkGlowMax;
  uniform vec3 uTrunk;
  uniform vec3 uMid;
  uniform vec3 uTip;
  uniform vec3 uSunnie;
  uniform vec3 uSunnieTip;
  varying float vDepth;
  varying float vGrow;
  varying float vFog;
  varying float vSunnie;
  varying float vSelected;
  varying float vRoot;
  varying float vTrunkT;

  void main() {
    if (vGrow < 0.01) discard;
    float t = vDepth / 8.0;

    vec3 color;
    if (vSunnie > 0.5) {
      color = mix(uSunnie, uSunnieTip, smoothstep(0.0, 0.8, t));
    } else if (vRoot > 0.5) {
      // Roots: deeper warm gold → copper
      vec3 rootBase = vec3(0.55, 0.35, 0.12);
      vec3 rootTip = vec3(0.85, 0.55, 0.15);
      color = mix(rootBase, rootTip, smoothstep(0.0, 0.7, t));
    } else {
      color = mix(uTrunk, uMid, smoothstep(0.0, 0.3, t));
      color = mix(color, uTip, smoothstep(0.35, 0.85, t));
    }

    float pulse = 0.85 + 0.15 * sin(uTime * 1.5 + vDepth * 2.0);
    color *= pulse;

    float alpha = vGrow * vFog * (0.55 - t * 0.15);

    // Selection: electric highlight on selected branch
    if (uSelectedUser >= 0.0 && vSelected > 0.5) {
      // Fast shimmer wave
      float wave = sin(vDepth * 10.0 - uTime * 6.0) * 0.5 + 0.5;
      float breathe = sin(uTime * 3.0) * 0.25 + 0.75;

      // Electric blue accent — consistent across branch, root, and trunk
      vec3 selectColor = vSunnie > 0.5
        ? vec3(0.3, 1.0, 0.9)   // cyan-electric for Sunnie
        : vec3(0.4, 0.6, 1.0);  // electric blue for everything else

      float energyCore = 1.8 + wave * 1.2;
      vec3 hotColor = mix(color, selectColor, 0.5 + 0.3 * wave);
      color = hotColor * energyCore;
      alpha = alpha * 3.0 + 0.35 * breathe;
    }

    // Trunk glow: light up trunk segments connecting branch to root
    // Fade out at the branch attachment point (subtract one segment width ~0.042)
    if (uTrunkGlowMax >= 0.0 && vDepth < 0.1 && vTrunkT >= 0.0 && vTrunkT <= uTrunkGlowMax + 0.005) {
      float trunkWave = sin(vTrunkT * 20.0 - uTime * 6.0) * 0.5 + 0.5;
      float breathe = sin(uTime * 3.0) * 0.25 + 0.75;
      vec3 trunkSelectColor = vec3(0.4, 0.6, 1.0);
      float energyCore = 1.8 + trunkWave * 1.2;
      vec3 hotColor = mix(color, trunkSelectColor, 0.5 + 0.3 * trunkWave);
      color = hotColor * energyCore;
      alpha = alpha * 3.0 + 0.35 * breathe;
    }

    gl_FragColor = vec4(color, min(alpha, 1.0));
  }
`;

const glowVert = `
  attribute float aDepth;
  attribute float aGrowTime;
  attribute float aSize;
  attribute float aIsSunnie;
  attribute float aUserIdx;
  attribute vec3 aBranchOrigin;
  uniform float uTime;
  uniform float uGrowth;
  uniform float uSelectedUser;
  uniform float uSelectedRoot;
  varying float vAlpha;
  varying float vSunnie;
  varying float vSelected;

  void main() {
    float grow = clamp((uGrowth - aGrowTime) / 0.04, 0.0, 1.0);
    vSelected = ((uSelectedUser >= 0.0 && abs(aUserIdx - uSelectedUser) < 0.5) ||
                 (uSelectedRoot >= 0.0 && abs(aUserIdx - uSelectedRoot) < 0.5)) ? 1.0 : 0.0;
    vAlpha = grow;
    vSunnie = aIsSunnie;

    // Glow points grow outward from branch origin
    vec3 pos = mix(aBranchOrigin, position, grow);
    float swayAmt = aDepth / 8.0 * 0.2 * grow;
    pos.x += sin(uTime * 0.6 + pos.y * 0.3) * swayAmt;
    pos.z += cos(uTime * 0.4 + pos.y * 0.25) * swayAmt * 0.5;

    if (uGrowth < aGrowTime - 0.02) { vAlpha = 0.0; }

    vec4 mv = modelViewMatrix * vec4(pos, 1.0);
    float sizeMult = 1.0;
    if (uSelectedUser >= 0.0 && vSelected > 0.5) {
      float breathe = sin(uTime * 3.0) * 0.4 + 1.6;
      sizeMult = breathe;
    }
    gl_PointSize = aSize * 280.0 / -mv.z * grow * sizeMult;
    gl_Position = projectionMatrix * mv;
  }
`;

const glowFrag = `
  uniform vec3 uGlow;
  uniform vec3 uGlowSunnie;
  uniform float uTime;
  uniform float uSelectedUser;
  varying float vAlpha;
  varying float vSunnie;
  varying float vSelected;

  void main() {
    if (vAlpha < 0.01) discard;
    float d = length(gl_PointCoord - 0.5) * 2.0;
    if (d > 1.0) discard;
    float a = pow(1.0 - smoothstep(0.0, 1.0, d), 2.0) * vAlpha * 0.2;
    vec3 c = mix(uGlow, uGlowSunnie, vSunnie);
    if (uSelectedUser >= 0.0 && vSelected > 0.5) {
      float pulse = sin(uTime * 4.0) * 0.3 + 1.0;
      a *= 4.0 * pulse;
      vec3 selectGlow = vSunnie > 0.5 ? vec3(0.3, 1.0, 0.9) : vec3(0.4, 0.6, 1.0);
      c = mix(c, selectGlow, 0.4);
    }
    gl_FragColor = vec4(c, a);
  }
`;

const leafVert = `
  attribute float aGrowTime;
  attribute float aPhase;
  attribute float aIsSunnie;
  attribute float aUserIdx;
  uniform float uTime;
  uniform float uGrowth;
  uniform float uSelectedUser;
  uniform float uSelectedRoot;
  varying float vAlpha;
  varying float vPhase;
  varying float vSunnie;
  varying float vSelected;

  void main() {
    float grow = smoothstep(aGrowTime, aGrowTime + 0.06, uGrowth);
    vSelected = ((uSelectedUser >= 0.0 && abs(aUserIdx - uSelectedUser) < 0.5) ||
                 (uSelectedRoot >= 0.0 && abs(aUserIdx - uSelectedRoot) < 0.5)) ? 1.0 : 0.0;
    vAlpha = grow;
    vPhase = aPhase;
    vSunnie = aIsSunnie;

    vec3 pos = position;
    pos.x += sin(uTime * 2.2 + aPhase * 6.28) * 0.18 * grow;
    pos.y += cos(uTime * 1.6 + aPhase * 4.0) * 0.10 * grow;
    pos.z += sin(uTime * 1.1 + aPhase * 5.0) * 0.13 * grow;

    vec4 mv = modelViewMatrix * vec4(pos, 1.0);
    float dist = -mv.z;
    gl_PointSize = (100.0 + 50.0 * sin(aPhase * 6.28)) / dist * grow;
    gl_Position = projectionMatrix * mv;
  }
`;

const leafFrag = `
  uniform vec3 uLeaf;
  uniform vec3 uLeafAlt;
  uniform vec3 uLeafSunnie;
  uniform vec3 uLeafSunnieAlt;
  uniform float uTime;
  uniform float uSelectedUser;
  varying float vAlpha;
  varying float vPhase;
  varying float vSunnie;
  varying float vSelected;

  void main() {
    if (vAlpha < 0.01) discard;
    float d = length(gl_PointCoord - 0.5) * 2.0;
    if (d > 1.0) discard;

    float a = (1.0 - smoothstep(0.0, 0.85, d)) * vAlpha * 0.4;
    vec3 c1 = mix(uLeaf, uLeafSunnie, vSunnie);
    vec3 c2 = mix(uLeafAlt, uLeafSunnieAlt, vSunnie);
    vec3 c = mix(c1, c2, vPhase);
    c *= 0.85 + 0.15 * sin(uTime * 2.5 + vPhase * 10.0);
    if (uSelectedUser >= 0.0 && vSelected > 0.5) {
      float leafPulse = sin(uTime * 3.5 + vPhase * 6.28) * 0.4 + 1.0;
      a *= 3.0 * leafPulse;
      vec3 selectLeaf = vSunnie > 0.5 ? vec3(0.3, 1.0, 0.9) : vec3(0.5, 0.7, 1.0);
      c = mix(c, selectLeaf, 0.3);
    }
    gl_FragColor = vec4(c, a);
  }
`;

// ─── BACKGROUND ───
const bgScene = new THREE.Scene();
const bgCamera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const bgMat = new THREE.ShaderMaterial({
  depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}`,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    void main(){
      // Hidden sun(nie) — drifts slowly in a lazy orbit
      float sunX = 0.5 + sin(uTime * 0.03) * 0.25 + sin(uTime * 0.017) * 0.1;
      float sunY = 0.4 + cos(uTime * 0.023) * 0.2 + sin(uTime * 0.011) * 0.08;
      vec2 sunPos = vec2(sunX, sunY);

      vec2 c = vUv - sunPos;
      float d = length(c);

      // Warm glow from the hidden sun
      vec3 sunCore = vec3(0.08, 0.055, 0.025);
      vec3 sunMid = vec3(0.04, 0.025, 0.012);
      vec3 outer = vec3(0.012, 0.008, 0.005);

      vec3 col = mix(sunCore, sunMid, smoothstep(0.0, 0.3, d));
      col = mix(col, outer, smoothstep(0.2, 0.7, d));

      // Subtle breathing
      col *= 0.92 + 0.08 * sin(uTime * 0.2 + d * 2.0);

      gl_FragColor = vec4(col, 1.0);
    }
  `,
  uniforms: { uTime: { value: 0 } }
});
bgScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), bgMat));

// ─── POST-PROCESSING ───
const composer = new EffectComposer(renderer);
const bgPass = new RenderPass(bgScene, bgCamera);
bgPass.clear = true;

const mainPass = new RenderPass(scene, camera);

const bloom = new UnrealBloomPass(

);

const chromatic = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null },
    uStrength: { value: 0.001 }
  },
  vertexShader: `varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uStrength;
    varying vec2 vUv;
    void main(){
      vec2 dir=vUv-0.5;
      float d=length(dir)*uStrength;
      vec2 off=dir*d;
      gl_FragColor=vec4(
        texture2D(tDiffuse,vUv+off).r,
        texture2D(tDiffuse,vUv).g,
        texture2D(tDiffuse,vUv-off).b,1.0);
    }
  `
});
composer.addPass(chromatic);
composer.addPass(new OutputPass());

// ─── INIT ───
async function init() {
  const hash = await fetchHash();
  const hp = hashToParams(hash);
  const { segs, lvs, gpts, conns } = buildTree(hp);

  // ── Branch lines ──
  const lPos=[], lStart=[], lDepth=[], lGrow=[], lEnd=[], lSun=[], lUi=[], lRoot=[], lTrunkT=[];
  for (const s of segs) {
    const gt = s.gt ?? (s.d + s.si * 0.8) / 10;
    const origin = s.bo ?? s.s;
    // Trunk segments (d=0): start vertex gets si, end vertex gets si + step
    // This lets the varying interpolate smoothly so the glow cutoff is pixel-precise
    const isTrunk = s.d === 0 && !s.root;
    const trunkTStart = isTrunk ? s.si : -1;
    const trunkTEnd = isTrunk ? s.si + 1/24 : -1; // 24 = tSegs
    // start vertex
    lPos.push(s.s.x,s.s.y,s.s.z);
    lStart.push(origin.x,origin.y,origin.z);
    lDepth.push(s.d); lGrow.push(gt); lEnd.push(0); lSun.push(s.sun?1:0); lUi.push(s.ui ?? -1); lRoot.push(s.root?1:0); lTrunkT.push(trunkTStart);
    // end vertex
    lPos.push(s.e.x,s.e.y,s.e.z);
    lStart.push(origin.x,origin.y,origin.z);
    lDepth.push(s.d); lGrow.push(gt); lEnd.push(1); lSun.push(s.sun?1:0); lUi.push(s.ui ?? -1); lRoot.push(s.root?1:0); lTrunkT.push(trunkTEnd);
  }

  const lineGeo = new THREE.BufferGeometry();
  lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(lPos, 3));
  lineGeo.setAttribute('aStartPos', new THREE.Float32BufferAttribute(lStart, 3));
  lineGeo.setAttribute('aDepth', new THREE.Float32BufferAttribute(lDepth, 1));
  lineGeo.setAttribute('aGrowTime', new THREE.Float32BufferAttribute(lGrow, 1));
  lineGeo.setAttribute('aIsEnd', new THREE.Float32BufferAttribute(lEnd, 1));
  lineGeo.setAttribute('aIsSunnie', new THREE.Float32BufferAttribute(lSun, 1));
  lineGeo.setAttribute('aUserIdx', new THREE.Float32BufferAttribute(lUi, 1));
  lineGeo.setAttribute('aIsRoot', new THREE.Float32BufferAttribute(lRoot, 1));
  lineGeo.setAttribute('aTrunkT', new THREE.Float32BufferAttribute(lTrunkT, 1));

  const lineMat = new THREE.ShaderMaterial({
    vertexShader: lineVert, fragmentShader: lineFrag,
    uniforms: {
      uTime:{value:0}, uGrowth:{value:0}, uSelectedUser:{value:-1}, uSelectedRoot:{value:-1}, uTrunkGlowMax:{value:-1},
      uTrunk:{value:PAL.trunk}, uMid:{value:PAL.mid}, uTip:{value:PAL.tip},
      uSunnie:{value:PAL.sun}, uSunnieTip:{value:PAL.sunTip},
    },
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  });
  scene.add(new THREE.LineSegments(lineGeo, lineMat));

  // ── Glow points ──
  const gPos=[], gDepth=[], gGrow=[], gSize=[], gSun=[], gOrigin=[], gUi=[];
  for (const g of gpts) {
    const gt = g.gt ?? (g.d + 0.5) / 10;
    const bo = g.bo ?? g.p;
    gPos.push(g.p.x,g.p.y,g.p.z);
    gOrigin.push(bo.x,bo.y,bo.z);
    gDepth.push(g.d); gGrow.push(gt); gSize.push(g.sz); gSun.push(g.sun?1:0); gUi.push(g.ui ?? -1);
  }

  const glowGeo = new THREE.BufferGeometry();
  glowGeo.setAttribute('position', new THREE.Float32BufferAttribute(gPos, 3));
  glowGeo.setAttribute('aBranchOrigin', new THREE.Float32BufferAttribute(gOrigin, 3));
  glowGeo.setAttribute('aDepth', new THREE.Float32BufferAttribute(gDepth, 1));
  glowGeo.setAttribute('aGrowTime', new THREE.Float32BufferAttribute(gGrow, 1));
  glowGeo.setAttribute('aSize', new THREE.Float32BufferAttribute(gSize, 1));
  glowGeo.setAttribute('aIsSunnie', new THREE.Float32BufferAttribute(gSun, 1));
  glowGeo.setAttribute('aUserIdx', new THREE.Float32BufferAttribute(gUi, 1));

  const glowMat = new THREE.ShaderMaterial({
    vertexShader: glowVert, fragmentShader: glowFrag,
    uniforms: {
      uTime:{value:0}, uGrowth:{value:0}, uSelectedUser:{value:-1}, uSelectedRoot:{value:-1},
      uGlow:{value:PAL.glow}, uGlowSunnie:{value:PAL.glowS},
    },
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  });
  scene.add(new THREE.Points(glowGeo, glowMat));

  // ── Leaves ──
  const leafP=[], leafG=[], leafPh=[], leafS=[], leafUi=[];
  for (const l of lvs) {
    leafP.push(l.p.x,l.p.y,l.p.z);
    leafG.push(l.gt ?? 0.85);
    leafPh.push(l.ph);
    leafS.push(l.sun?1:0);
    leafUi.push(l.ui ?? -1);
  }

  const leafGeo = new THREE.BufferGeometry();
  leafGeo.setAttribute('position', new THREE.Float32BufferAttribute(leafP, 3));
  leafGeo.setAttribute('aGrowTime', new THREE.Float32BufferAttribute(leafG, 1));
  leafGeo.setAttribute('aPhase', new THREE.Float32BufferAttribute(leafPh, 1));
  leafGeo.setAttribute('aIsSunnie', new THREE.Float32BufferAttribute(leafS, 1));
  leafGeo.setAttribute('aUserIdx', new THREE.Float32BufferAttribute(leafUi, 1));

  const leafMat = new THREE.ShaderMaterial({
    vertexShader: leafVert, fragmentShader: leafFrag,
    uniforms: {
      uTime:{value:0}, uGrowth:{value:0}, uSelectedUser:{value:-1}, uSelectedRoot:{value:-1},
      uLeaf:{value:new THREE.Color('#ffaa44')},
      uLeafAlt:{value:new THREE.Color('#ffcc66')},
      uLeafSunnie:{value:new THREE.Color('#22ccaa')},
      uLeafSunnieAlt:{value:new THREE.Color('#55eebb')},
    },
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  });
  scene.add(new THREE.Points(leafGeo, leafMat));

  const allMats = [lineMat, glowMat, leafMat];

  // ── Connection energy streams — animated dashed lines between branches ──
  if (conns.length > 0) {
    const cPos = [], cT = [], cWeight = [], cSun = [], cGrow = [];
    for (const c of conns) {
      // Start vertex
      cPos.push(c.s.x, c.s.y, c.s.z);
      cT.push(c.t0);
      cWeight.push(c.w); cSun.push(c.sun?1:0); cGrow.push(c.gt);
      // End vertex
      cPos.push(c.e.x, c.e.y, c.e.z);
      cT.push(c.t1);
      cWeight.push(c.w); cSun.push(c.sun?1:0); cGrow.push(c.gt);
    }
    const connGeo = new THREE.BufferGeometry();
    connGeo.setAttribute('position', new THREE.Float32BufferAttribute(cPos, 3));
    connGeo.setAttribute('aArcT', new THREE.Float32BufferAttribute(cT, 1));
    connGeo.setAttribute('aWeight', new THREE.Float32BufferAttribute(cWeight, 1));
    connGeo.setAttribute('aIsSunnie', new THREE.Float32BufferAttribute(cSun, 1));
    connGeo.setAttribute('aGrowTime', new THREE.Float32BufferAttribute(cGrow, 1));

    const connMat = new THREE.ShaderMaterial({
      vertexShader: `
        attribute float aArcT;
        attribute float aWeight;
        attribute float aIsSunnie;
        attribute float aGrowTime;
        uniform float uTime;
        uniform float uGrowth;
        varying float vArcT;
        varying float vWeight;
        varying float vSunnie;
        varying float vAppear;
        void main() {
          vArcT = aArcT;
          vWeight = aWeight;
          vSunnie = aIsSunnie;
          vAppear = smoothstep(aGrowTime, aGrowTime + 0.06, uGrowth);
          vec3 pos = position;
          // Perpendicular noise wiggle — organic oscillation
          float wiggle = sin(aArcT * 12.0 + uTime * 1.5) * 0.15
                       + sin(aArcT * 7.0 - uTime * 0.8) * 0.08;
          wiggle *= sin(aArcT * 3.14159) * vAppear; // fade at endpoints
          pos.x += wiggle * cos(aArcT * 6.28);
          pos.z += wiggle * sin(aArcT * 6.28);
          pos.y += sin(aArcT * 5.0 + uTime * 1.2) * 0.06 * vAppear;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        varying float vArcT;
        varying float vWeight;
        varying float vSunnie;
        varying float vAppear;
        void main() {
          if (vAppear < 0.01) discard;
          // Dual flow pattern — two sine waves create complex energy flow
          float flow1 = sin(vArcT * 20.0 - uTime * 3.5);
          float flow2 = sin(vArcT * 12.0 - uTime * 2.0 + 1.57);
          float combined = max(flow1, flow2);
          float brightness = smoothstep(-0.2, 0.6, combined);
          // Base trace always slightly visible
          float baseGlow = 0.04 * vWeight;
          float alpha = vAppear * (baseGlow + brightness * (0.1 + 0.15 * vWeight));
          if (alpha < 0.01) discard;
          // Subtle color modulation along the arc
          float colorShift = 0.9 + 0.1 * sin(uTime * 0.5 + vArcT * 8.0);
          vec3 c = mix(vec3(1.0, 0.8, 0.55), vec3(0.25, 1.0, 0.85), vSunnie);
          c *= colorShift;
          gl_FragColor = vec4(c, alpha);
        }
      `,
      uniforms: {
        uTime: { value: 0 },
        uGrowth: { value: 0 },
      },
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    const connMesh = new THREE.LineSegments(connGeo, connMat);
    scene.add(connMesh);
    allMats.push(connMat);

    // Arc toggle
    const toggleBtn = document.getElementById('toggle-arcs');
    toggleBtn.addEventListener('click', () => {
      connMesh.visible = !connMesh.visible;
      toggleBtn.classList.toggle('active', connMesh.visible);
    });
  }

  // ── HUD ──
  const shortHash = hash.replace(/^0+/,'').slice(0,12) + '…';
  const nConns = conns.length / 12; // 12 segments per connection arc
  document.getElementById('info').innerHTML =
    `HASH TREE — <span class="sunnie">TreeChat Community</span><br>` +
    `block ${TC_META.height} · ${shortHash}<br>` +
    `${TC_META.posts.toLocaleString()} posts · ${TC_META.users} users · ${TC_META.days} days<br>` +
    `${segs.length} branches · ${lvs.length} leaves · ${Math.round(nConns)} connections<br>` +
    `<span class="sunnie">■</span> Sunnie · 285 posts · 14.36M sats received<br>` +
    `branch thickness = posts × 0.4 + tips × 0.6`;

  // ── User tip positions for camera focus ──
  // userTips was built during tree construction — map name→position

  // ── Search & Selection ──
  let selectedUserIdx = -1;
  const searchInput = document.getElementById('search-input');
  const searchResults = document.getElementById('search-results');
  const selectedInfoEl = document.getElementById('selected-info');

  function formatSats(sats) {
    if (sats >= 100000000) return (sats / 100000000).toFixed(2) + ' BSV';
    if (sats >= 1000000) return (sats / 1000000).toFixed(1) + 'M sats';
    if (sats >= 1000) return (sats / 1000).toFixed(0) + 'K sats';
    return sats + ' sats';
  }

  function selectUser(idx, rootIdx) {
    selectedUserIdx = idx;
    // For dual selection (branch+root), use uSelectedUser for branch and uSelectedRoot for root
    // Calculate trunk glow: if user has both branch and root, light the trunk between them
    let trunkGlow = -1;
    if (idx >= 0 && idx < TC_USERS.length && (rootIdx ?? -1) >= 0) {
      // User has both a branch and root — find their branch attachment height
      const u = TC_USERS[idx];
      const days = (new Date(u.s) - GENESIS) / 86400000;
      const hRatio = Math.max(0.06, Math.min(0.95, days / TOTAL_DAYS));
      trunkGlow = hRatio; // light trunk from base to branch attachment
    }

    for (const m of allMats) {
      if (m.uniforms.uSelectedUser) m.uniforms.uSelectedUser.value = idx;
      if (m.uniforms.uSelectedRoot) m.uniforms.uSelectedRoot.value = rootIdx ?? -1;
      if (m.uniforms.uTrunkGlowMax) m.uniforms.uTrunkGlowMax.value = trunkGlow;
    }
    searchResults.style.display = 'none';

    // Find user info from either TC_USERS or TC_GIVERS
    let name, posts, joinDate, tips, given;
    if (idx >= 0 && idx < TC_USERS.length) {
      const u = TC_USERS[idx];
      name = u.n; posts = u.p; joinDate = u.s;
    } else if (idx >= ROOT_OFFSET) {
      const g = TC_GIVERS[idx - ROOT_OFFSET];
      if (g) { name = g.n; posts = g.p; joinDate = g.s; }
    }

    if (name) {
      tips = TC_TIPS[name] || 0;
      const giver = TC_GIVERS.find(g => g.n === name);
      given = giver ? giver.g : 0;
      const isSun = name === 'Sunnie';
      selectedInfoEl.innerHTML =
        `<div class="${isSun ? 'name sunnie-name' : 'name'}">${name}</div>` +
        `${posts} posts · joined ${joinDate}<br>` +
        (tips > 0 ? `${formatSats(tips)} received<br>` : '') +
        (given > 0 ? `${formatSats(given)} given 🌱<br>` : '') +
        `<br><span style="opacity:0.4;cursor:pointer" onclick="window._clearSelection()">✕ clear</span>`;
      selectedInfoEl.style.display = 'block';

      const tip = userTips[name] || userTips[name + '_root'];
      if (tip) {
        controls.target.set(tip.x * 0.3, Math.max(tip.y * 0.8, 2), tip.z * 0.3);
      }
    } else {
      selectedInfoEl.style.display = 'none';
      controls.target.set(0, 9, 0);
    }
  }

  window._clearSelection = () => selectUser(-1);

  // Build combined searchable list: branches + root-only givers
  const searchableUsers = [];
  TC_USERS.forEach((u, i) => searchableUsers.push({ name: u.n, idx: i, posts: u.p, type: 'branch' }));
  TC_GIVERS.forEach((g, i) => {
    // Only add if not already a branch user
    if (!searchableUsers.find(s => s.name === g.n)) {
      searchableUsers.push({ name: g.n, idx: ROOT_OFFSET + i, posts: g.p, given: g.g, type: 'root' });
    } else {
      // User has both branch and root — add root index as alt
      const existing = searchableUsers.find(s => s.name === g.n);
      existing.given = g.g;
      existing.rootIdx = ROOT_OFFSET + i;
    }
  });

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.toLowerCase().trim();
    if (!q) { searchResults.style.display = 'none'; return; }
    const matches = searchableUsers
      .filter(s => s.name.toLowerCase().includes(q))
      .slice(0, 12);
    if (matches.length === 0) { searchResults.style.display = 'none'; return; }
    searchResults.innerHTML = matches.map(s => {
      const tips = TC_TIPS[s.name] || 0;
      const given = s.given || TC_GIVERS.find(g => g.n === s.name)?.g || 0;
      const cls = s.name === 'Sunnie' ? 'search-item sunnie-item' : 'search-item';
      const typeLabel = s.type === 'root' ? ' 🌱' : '';
      return `<div class="${cls}" data-idx="${s.idx}" data-root-idx="${s.rootIdx ?? -1}">` +
        `${s.name}${typeLabel} <span class="sats">${s.posts}p` +
        (tips > 0 ? ` · recv ${formatSats(tips)}` : '') +
        (given > 0 ? ` · gave ${formatSats(given)}` : '') +
        `</span></div>`;
    }).join('');
    searchResults.style.display = 'block';
  });

  searchResults.addEventListener('click', (e) => {
    const item = e.target.closest('.search-item');
    if (!item) return;
    const idx = parseInt(item.dataset.idx);
    const rootIdx = parseInt(item.dataset.rootIdx);
    const entry = searchableUsers.find(s => s.idx === idx);
    searchInput.value = entry?.name || '';
    selectUser(idx, rootIdx >= 0 ? rootIdx : undefined);
  });

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      searchInput.value = '';
      searchResults.style.display = 'none';
      selectUser(-1);
    }
    if (e.key === 'Enter') {
      const first = searchResults.querySelector('.search-item');
      if (first) first.click();
    }
  });

  // ── Speed slider ──
  const speedSlider = document.getElementById('speed-slider');
  speedSlider.addEventListener('input', () => {
    controls.autoRotateSpeed = (speedSlider.value / 100) * 0.6;
  });

  // ── Animate ──
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    const growth = Math.min(t / GROW_DUR, 1.0);

    for (const m of allMats) {
      m.uniforms.uTime.value = t;
      m.uniforms.uGrowth.value = growth;
    }
    bgMat.uniforms.uTime.value = t;
    controls.update();
    composer.render();
  }
  animate();
}

init();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
