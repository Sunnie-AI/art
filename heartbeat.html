const maxGap = Math.max(...BLOCKS.map(b => b.g));
const maxPosts = Math.max(...BLOCKS.map(b => b.p));
const totalPosts = BLOCKS.reduce((s, b) => s + b.p, 0);
const sortedGaps = [...BLOCKS.map(b => b.g)].sort((a,b) => a - b);
const medianGap = sortedGaps[Math.floor(sortedGaps.length / 2)];

// Color from merkle hex
function mColor(hex, off, a) {
  const r = parseInt(hex.slice(off, off+2), 16);
  const g = parseInt(hex.slice(off+2, off+4), 16);
  const b = parseInt(hex.slice(off+4, off+6), 16);
  return `rgba(${r},${g},${b},${a})`;
}
function mBright(hex, off, a) {
  let r = parseInt(hex.slice(off, off+2), 16);
  let g = parseInt(hex.slice(off+2, off+4), 16);
  let b = parseInt(hex.slice(off+4, off+6), 16);
  r = Math.min(255, r + 80); g = Math.min(255, g + 80); b = Math.min(255, b + 80);
  return `rgba(${r},${g},${b},${a})`;
}
function mRGB(hex, off) {
  return [parseInt(hex.slice(off, off+2), 16), parseInt(hex.slice(off+2, off+4), 16), parseInt(hex.slice(off+4, off+6), 16)];
}

// Waveform shape: EKG-inspired
// Gap = time between blocks. Short gap = rapid beat (tall spike). Long gap = slow (wide, shallow).
// Posts = amplitude modifier.
const marginX = 60;
const waveW = () => W - marginX * 2;
const baseY = () => H * 0.58;

function blockX(i) {
  return marginX + (i / (BLOCKS.length - 1)) * waveW();
}

function blockY(i) {
  const b = BLOCKS[i];
  // Invert gap: shorter gaps = bigger upward spikes (rapid heartbeat)
  // Use log scale for better distribution
  const gapNorm = Math.log1p(b.g) / Math.log1p(maxGap); // 0=short, 1=long
  const postNorm = b.p / maxPosts; // 0=few, 1=many

  // Heartbeat shape: short gaps spike UP, long gaps dip slightly DOWN
  // Post count amplifies the spike
  const spikeUp = (1 - gapNorm) * H * 0.35 * (0.3 + postNorm * 0.7);
  const dipDown = gapNorm * H * 0.06;

  return baseY() - spikeUp + dipDown;
}

// Particles
class Particle {
  constructor(x, y, block) {
    this.x = x;
    this.y = y;
    this.birth = performance.now();
    this.life = 1500 + Math.random() * 3500;
    this.size = 1 + (block.p / maxPosts) * 3;
    const speed = 0.3 + Math.random() * 0.8;
    const angle = -Math.PI/2 + (Math.random() - 0.5) * Math.PI * 0.6;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.merkle = block.m;
    this.postNorm = block.p / maxPosts;
  }
  update(now) {
    const t = (now - this.birth) / this.life;
    if (t > 1) return false;
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.995;
    this.vy *= 0.995;
    this.vy += 0.005; // slight gravity
    this.alpha = t < 0.1 ? t * 10 : t > 0.5 ? (1 - t) / 0.5 : 1;
    return true;
  }
  draw(ctx) {
    if (this.alpha <= 0) return;
    const s = this.size * (0.5 + this.alpha * 0.5);
    ctx.beginPath();
    ctx.arc(this.x, this.y, s, 0, Math.PI * 2);
    ctx.fillStyle = mBright(this.merkle, 0, this.alpha * 0.8);
    ctx.fill();
    // Tiny glow
    if (this.postNorm > 0.3) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, s * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = mColor(this.merkle, 0, this.alpha * 0.08);
      ctx.fill();
    }
  }
}

let particles = [];
let scanPos = 0; // 0 to 1
const scanSpeed = 0.0006;
let lastScanIdx = -1;
let frame = 0;

function drawBackground() {
  // Subtle gradient from center
  const grd = ctx.createRadialGradient(W/2, H*0.5, 0, W/2, H*0.5, W*0.7);
  grd.addColorStop(0, 'rgba(15, 20, 40, 0.3)');
  grd.addColorStop(1, 'rgba(6, 6, 15, 0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  // Baseline
  ctx.strokeStyle = 'rgba(100, 150, 255, 0.03)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 8]);
  ctx.beginPath();
  ctx.moveTo(marginX, baseY());
  ctx.lineTo(W - marginX, baseY());
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawWaveform(now) {
  // Draw the waveform as a smooth curve
  // First: fill area under the curve
  ctx.beginPath();
  ctx.moveTo(blockX(0), baseY());
  for (let i = 0; i < BLOCKS.length; i++) {
    const x = blockX(i);
    const y = blockY(i);
    if (i === 0) {
      ctx.lineTo(x, y);
    } else {
      const px = blockX(i-1);
      const py = blockY(i-1);
      const cpx = (px + x) / 2;
      ctx.bezierCurveTo(cpx, py, cpx, y, x, y);
    }
  }
  ctx.lineTo(blockX(BLOCKS.length - 1), baseY());
  ctx.closePath();

  // Gradient fill under curve
  const fillGrad = ctx.createLinearGradient(0, baseY() - H * 0.25, 0, baseY());
  fillGrad.addColorStop(0, 'rgba(60, 120, 255, 0.1)');
  fillGrad.addColorStop(0.5, 'rgba(40, 80, 200, 0.05)');
  fillGrad.addColorStop(1, 'rgba(20, 40, 100, 0)');
  ctx.fillStyle = fillGrad;
  ctx.fill();

  // Draw colored segments
  for (let i = 1; i < BLOCKS.length; i++) {
    const b = BLOCKS[i];
    const x = blockX(i);
    const y = blockY(i);
    const px = blockX(i-1);
    const py = blockY(i-1);

    // Line segment with merkle color
    const gapNorm = Math.log1p(b.g) / Math.log1p(maxGap);
    const postNorm = b.p / maxPosts;
    const alpha = 0.2 + postNorm * 0.5 + (1 - gapNorm) * 0.2;
    const lineW = 1.2 + postNorm * 2.5;

    ctx.beginPath();
    const cpx = (px + x) / 2;
    ctx.moveTo(px, py);
    ctx.bezierCurveTo(cpx, py, cpx, y, x, y);
    ctx.strokeStyle = mBright(b.m, 0, alpha);
    ctx.lineWidth = lineW;
    ctx.stroke();
  }

  // Dots at peaks
  for (let i = 0; i < BLOCKS.length; i++) {
    const b = BLOCKS[i];
    const x = blockX(i);
    const y = blockY(i);
    const postNorm = b.p / maxPosts;
    const gapNorm = Math.log1p(b.g) / Math.log1p(maxGap);
    const spikeHeight = (1 - gapNorm) * postNorm;

    if (spikeHeight > 0.15) {
      const dotR = 1.5 + spikeHeight * 3;
      // Glow
      const glowR = dotR * 5;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, glowR);
      grad.addColorStop(0, mBright(b.m, 0, 0.2 + spikeHeight * 0.3));
      grad.addColorStop(0.3, mColor(b.m, 0, 0.1));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath();
      ctx.arc(x, y, glowR, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // Dot
      ctx.beginPath();
      ctx.arc(x, y, dotR, 0, Math.PI * 2);
      ctx.fillStyle = mBright(b.m, 0, 0.6 + spikeHeight * 0.4);
      ctx.fill();
    }
  }
}

function drawScanLine(now) {
  const sx = marginX + scanPos * waveW();

  // Glow behind scan line
  const grad = ctx.createLinearGradient(sx - 60, 0, sx + 3, 0);
  grad.addColorStop(0, 'rgba(80, 140, 255, 0)');
  grad.addColorStop(0.6, 'rgba(80, 140, 255, 0.02)');
  grad.addColorStop(1, 'rgba(120, 180, 255, 0.08)');
  ctx.fillStyle = grad;
  ctx.fillRect(sx - 60, H * 0.15, 63, H * 0.7);

  // The line itself
  ctx.strokeStyle = 'rgba(120, 180, 255, 0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(sx, H * 0.15);
  ctx.lineTo(sx, H * 0.85);
  ctx.stroke();

  // Current block
  const idx = Math.round(scanPos * (BLOCKS.length - 1));
  if (idx >= 0 && idx < BLOCKS.length && idx !== lastScanIdx) {
    lastScanIdx = idx;
    const b = BLOCKS[idx];
    const x = blockX(idx);
    const y = blockY(idx);

    // Spawn particles
    const count = Math.ceil(b.p * 0.8);
    for (let j = 0; j < Math.min(count, 30); j++) {
      particles.push(new Particle(x, y, b));
    }

    // Bright flash at intersection
    ctx.beginPath();
    ctx.arc(x, y, 3 + (b.p / maxPosts) * 8, 0, Math.PI * 2);
    const flashGrad = ctx.createRadialGradient(x, y, 0, x, y, 3 + (b.p / maxPosts) * 8);
    flashGrad.addColorStop(0, mBright(b.m, 0, 0.8));
    flashGrad.addColorStop(1, mColor(b.m, 0, 0));
    ctx.fillStyle = flashGrad;
    ctx.fill();

    info.textContent = `block ${b.h} · gap ${b.g}s · ${b.p} posts · merkle ${b.m}`;
  }

  scanPos += scanSpeed;
  if (scanPos > 1) {
    scanPos = 0;
    lastScanIdx = -1;
  }
}

function drawAmbientParticles(now) {
  // Very subtle floating dots across the canvas — atmosphere
  if (frame % 8 === 0) {
    const b = BLOCKS[Math.floor(Math.random() * BLOCKS.length)];
    const x = Math.random() * W;
    const y = H * 0.2 + Math.random() * H * 0.5;
    ctx.beginPath();
    ctx.arc(x, y, 0.5 + Math.random(), 0, Math.PI * 2);
    ctx.fillStyle = mColor(b.m, 0, 0.03 + Math.random() * 0.02);
    ctx.fill();
  }
}

function drawStats() {
  ctx.fillStyle = 'rgba(140,180,255,0.06)';
  ctx.font = '10px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(`${totalPosts} posts · 500 blocks · median gap ${medianGap}s`, W - 20, H - 16);
  ctx.textAlign = 'left';
}

function draw(now) {
  // Full clear
  ctx.fillStyle = '#06060f';
  ctx.fillRect(0, 0, W, H);
  frame++;

  drawBackground();
  drawWaveform(now);
  drawScanLine(now);

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    if (!particles[i].update(now)) {
      particles.splice(i, 1);
      continue;
    }
    particles[i].draw(ctx);
  }

  drawAmbientParticles(now);
  drawStats();

  if (particles.length > 4000) particles = particles.slice(-3000);

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
