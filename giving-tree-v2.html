  #timeline {

    background: linear-gradient(transparent, rgba(10,10,15,0.95));
    display: flex; align-items: center; gap: 12px;
  }
  #play-btn {
    background: none; border: 1px solid rgba(255,180,60,0.3);

    border-radius: 50%; cursor: pointer; flex-shrink: 0;

  }

  #slider-wrap {
    flex: 1; display: flex; flex-direction: column; gap: 2px;
  }
  #date-slider {
    width: 100%; height: 6px; -webkit-appearance: none; appearance: none;
    background: rgba(255,180,60,0.15); border-radius: 3px; outline: none;
    cursor: pointer;
  }
  #date-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    background: #ffb43c; border-radius: 50%; cursor: grab;
  }
  #date-slider::-moz-range-thumb {
    width: 14px; height: 14px; background: #ffb43c;
    border-radius: 50%; border: none; cursor: grab;
  }
  #month-labels {
    display: flex; justify-content: space-between;
    font-size: 9px; color: rgba(180,160,130,0.35);
    padding: 0 2px; user-select: none;
  }
  
  #date-display {
    font-size: 14px; color: #ffb43c; flex-shrink: 0;
    min-width: 90px; text-align: right;
  }
  
  #controls {
    position: absolute; top: 16px; right: 16px;
    font-size: 11px; opacity: 0.6;
  }
  #controls label { display: block; margin-bottom: 4px; }
  #sats-slider, #speed-slider { width: 120px; }
  #sats-val, #speed-val { color: #ffb43c; }
  
  #tooltip {
    position: absolute; display: none;
    background: rgba(10,10,20,0.94); border: 1px solid rgba(255,180,60,0.3);
    border-radius: 6px; padding: 10px 14px;
    color: rgba(255,200,120,0.85); font: 12px monospace;
    pointer-events: none; z-index: 10; max-width: 300px; line-height: 1.5;
  }
  #tooltip .name { font-size: 14px; font-weight: bold; margin-bottom: 4px; }
  #tooltip .giver { color: #ff8844; }
  #tooltip .receiver { color: #44ccaa; }
  #tooltip .balanced { color: #ccaa44; }
  #tooltip .stat { color: rgba(255,200,120,0.5); font-size: 11px; }
  
  #legend {
    position: absolute; bottom: 76px; right: 16px;
    font-size: 11px; line-height: 1.8; opacity: 0.5;
    pointer-events: none;
  }
  .legend-dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; margin-right: 6px; vertical-align: middle;
  }
  
  #title-overlay {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px; color: rgba(255,180,60,0.15);
    pointer-events: none; transition: opacity 2s;
    text-align: center; line-height: 1.6;
  }
  #title-overlay .sub { font-size: 14px; color: rgba(180,160,130,0.1); }

// 500 days total range. At 60fps: days_per_frame = speed / 60
const SPEED_LEVELS = [0.05, 0.1, 0.25, 0.5, 1, 2, 4, 8, 16];
const SPEED_LABELS = ['0.05x ~16m', '0.1x ~8m', '0.25x ~3m', '0.5x ~100s', '1x ~50s', '2x ~25s', '4x ~12s', '8x ~6s', '16x ~3s'];
let playSpeed = SPEED_LEVELS[4]; // default 1x

// Particles
const particles = [];
const MAX_PARTICLES = 10000;

// Camera
let cam = { x: 0, y: 0, zoom: 1 };

function screenToWorld(sx, sy) {
  return {
    x: (sx - W/2) / cam.zoom + W/2 - cam.x,
    y: (sy - H/2) / cam.zoom + H/2 - cam.y
  };
}

// === NODE MANAGEMENT ===
function getOrCreateNode(name) {
  if (!nodeMap[name]) {
    const angle = Math.random() * Math.PI * 2;
    const r = 100 + Math.random() * 300;
    nodeMap[name] = {
      name, given: 0, received: 0, total: 0, ratio: 0,
      x: W/2 + Math.cos(angle) * r,
      y: H/2 + Math.sin(angle) * r,
      vx: 0, vy: 0, radius: 3,
      pinned: false, dragging: false,
      birthTime: Date.now(), visible: false,
      edgeCount: 0,
    };
  }
  return nodeMap[name];
}

// === FILTERING ===
function recompute() {
  // Reset node stats
  for (const name in nodeMap) {
    const n = nodeMap[name];
    n.given = 0; n.received = 0; n.total = 0;
    n.ratio = 0; n.visible = false; n.edgeCount = 0;
  }

  // Filter edges by date and sats threshold
  // For node sizing: accumulate sats from ALL edges up to currentDate (regardless of min threshold)
  // so nodes grow smoothly even when small tips are filtered from display
  activeEdges = [];
  for (let i = 0; i < allEdges.length; i++) {
    const e = allEdges[i];
    if (e.d1 > currentDate) continue;

    // Always accumulate stats for node sizing (temporal growth)
    const src = getOrCreateNode(e.from);
    const tgt = getOrCreateNode(e.to);
    src.given += e.sats;
    tgt.received += e.sats;

    // Only add to visible edges if above sats threshold
    if (e.sats >= minSats) {
      src.visible = true;
      src.edgeCount++;
      tgt.visible = true;
      tgt.edgeCount++;
      activeEdges.push({
        source: src, target: tgt,
        sats: e.sats, count: e.count,
        fromName: e.from, toName: e.to,
      });
    }
  }

  // Compute node stats
  activeNodes = [];
  let maxTotal = 1;
  for (const name in nodeMap) {
    const n = nodeMap[name];
    if (!n.visible) continue;
    n.total = n.given + n.received;
    n.ratio = n.total > 0 ? (n.received - n.given) / n.total : 0;
    if (n.total > maxTotal) maxTotal = n.total;
    activeNodes.push(n);
  }

  // Scale radii — fixed to all-time max so nodes grow over timeline
  for (const n of activeNodes) {
    const logVal = Math.log(n.total + 1) / LOG_ALL_TIME_MAX; // 0..1 against all-time max
    n.radius = 0.6 + Math.pow(logVal, 3.5) * 30;
  }

  // Mark top nodes for labels
  const sorted = [...activeNodes].sort((a, b) => b.radius - a.radius);
  const labelCount = Math.min(25, Math.ceil(activeNodes.length * 0.04));
  for (const n of activeNodes) n._showLabel = false;
  for (let i = 0; i < Math.min(labelCount, sorted.length); i++) {
    sorted[i]._showLabel = true;
  }

  // Sort edges by sats for rendering (thin first, thick on top)
  activeEdges.sort((a, b) => a.sats - b.sats);

  // Edge strengths
  const maxSats = activeEdges.length > 0 ? activeEdges[activeEdges.length - 1].sats : 1;
  for (const e of activeEdges) {
    e.strength = Math.pow(e.sats / maxSats, 0.3);
  }

  // Update stats display
  let totalSats = 0, totalTips = 0;
  for (const e of activeEdges) { totalSats += e.sats; totalTips += e.count; }
  
  const d = new Date(currentDate);
  const dateStr = d.toISOString().slice(0, 10);
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const prettyDate = monthNames[d.getUTCMonth()] + ' ' + d.getUTCDate() + ', ' + d.getUTCFullYear();
  
  document.getElementById('s-date').textContent = prettyDate;
  document.getElementById('s-nodes').textContent = activeNodes.length;
  document.getElementById('s-edges').textContent = activeEdges.length.toLocaleString();
  document.getElementById('s-sats').textContent = (totalSats / 100000000).toFixed(1);
  document.getElementById('s-tips').textContent = totalTips.toLocaleString();
  document.getElementById('date-display').textContent = prettyDate;
}

// === FORCE SIMULATION ===
function simulate() {
  const N = activeNodes.length;
  if (N === 0) return;

  // Adaptive parameters based on node count
  const repulsionStrength = N > 300 ? 3.5 : N > 100 ? 4.5 : 5.0;
  const repulsionRange = N > 300 ? 4.5 : 5;
  const edgeForce = N > 300 ? 0.000006 : 0.000012;
  const idealBase = N > 300 ? 140 : 100;
  const idealRange = N > 300 ? 350 : 250;

  // Center gravity — proportional to node significance
  // Hubs feel strong pull to center, peripheral nodes barely feel it → natural shell structure
  const cx = W / 2, cy = (H - 64) / 2;
  for (const n of activeNodes) {
    if (n.dragging || n.pinned) continue;
    const dx = cx - n.x;
    const dy = cy - n.y;
    const significance = Math.pow(Math.log(n.total + 1) / LOG_ALL_TIME_MAX, 2); // 0..1, fixed ref
    const pull = 0.000018 + significance * 0.00005; // peripherals: ~0.000018, hubs: ~0.00007
    n.vx += dx * pull;
    n.vy += dy * pull;
  }

  // Node repulsion (O(n^2) — fine up to ~1000 nodes)
  for (let i = 0; i < N; i++) {
    const ni = activeNodes[i];
    for (let j = i + 1; j < N; j++) {
      const nj = activeNodes[j];
      const dx = nj.x - ni.x;
      const dy = nj.y - ni.y;
      const distSq = dx * dx + dy * dy;
      const minDist = ni.radius + nj.radius + 15;
      const rangeSq = (minDist * repulsionRange) * (minDist * repulsionRange);
      if (distSq > rangeSq) continue;
      const dist = Math.sqrt(distSq) || 0.1;
      const force = (minDist * 1.2) / (distSq) * repulsionStrength;
      if (!ni.pinned && !ni.dragging) {
        ni.vx -= dx * force;
        ni.vy -= dy * force;
      }
      if (!nj.pinned && !nj.dragging) {
        nj.vx += dx * force;
        nj.vy += dy * force;
      }
    }
  }

  // Edge attraction
  for (const e of activeEdges) {
    const src = e.source;
    const tgt = e.target;
    const dx = tgt.x - src.x;
    const dy = tgt.y - src.y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const idealDist = idealBase + (1 - e.strength) * idealRange;
    const f = (dist - idealDist) * edgeForce * (0.15 + e.strength * 0.85);
    if (!src.pinned && !src.dragging) {
      src.vx += dx * f;
      src.vy += dy * f;
    }
    if (!tgt.pinned && !tgt.dragging) {
      tgt.vx -= dx * f;
      tgt.vy -= dy * f;
    }
  }

  // Damping & update
  for (const n of activeNodes) {
    n.vx *= 0.88;
    n.vy *= 0.88;
    if (!n.dragging && !n.pinned) {
      n.x += n.vx * 0.4;
      n.y += n.vy * 0.4;
      // Very soft circular boundary — just prevents flying off screen
      const bCx = W / 2, bCy = (H - 80) / 2;
      const bRadius = Math.min(W, H - 80) * 0.75;
      const bdx = n.x - bCx, bdy = n.y - bCy;
      const bDist = Math.sqrt(bdx * bdx + bdy * bdy);
      if (bDist > bRadius) {
        const overshoot = bDist - bRadius;
        const pushBack = overshoot * 0.03;
        n.vx -= (bdx / bDist) * pushBack;
        n.vy -= (bdy / bDist) * pushBack;
      }
    }
  }
}

// === PARTICLES ===
function spawnParticle() {
  if (particles.length >= MAX_PARTICLES || activeEdges.length === 0) return;
  // Bias toward higher-sats edges
  const idx = Math.floor(Math.pow(Math.random(), 1.5) * activeEdges.length);
  const e = activeEdges[activeEdges.length - 1 - idx]; // reversed since sorted asc
  if (!e) return;
  particles.push({
    source: e.source, target: e.target,
    progress: 0,
    speed: 0.006 + Math.random() * 0.01,
    size: 1.2 + e.strength * 2.2,
    alpha: 0.35 + Math.random() * 0.45,
  });
}

// === COLORS ===
function ratioColor(ratio, alpha) {
  const t = (ratio + 1) / 2; // 0=pure giver, 1=pure receiver
  const r = Math.round(255 - t * 200);
  const g = Math.round(100 + t * 100);
  const b = Math.round(20 + t * 150);
  return `rgba(${r},${g},${b},${alpha})`;
}

// === RENDERING ===
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = 'rgba(10,10,15,0.2)';
  ctx.fillRect(0, 0, W, H);

  ctx.setTransform(cam.zoom, 0, 0, cam.zoom,
    W/2 - (W/2 - cam.x) * cam.zoom,
    H/2 - (H/2 - cam.y) * cam.zoom);

  // Edges
  for (const e of activeEdges) {
    const alpha = 0.03 + e.strength * 0.12;
    ctx.strokeStyle = `rgba(140,120,90,${alpha})`;
    ctx.lineWidth = 0.3 + e.strength * 2.5;
    ctx.beginPath();
    ctx.moveTo(e.source.x, e.source.y);
    ctx.lineTo(e.target.x, e.target.y);
    ctx.stroke();
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (!p.source.visible || !p.target.visible) {
      particles.splice(i, 1); continue;
    }
    const x = p.source.x + (p.target.x - p.source.x) * p.progress;
    const y = p.source.y + (p.target.y - p.source.y) * p.progress;
    p.progress += p.speed;
    if (p.progress >= 1) { particles.splice(i, 1); continue; }
    const fade = p.progress < 0.1 ? p.progress * 10 :
                 p.progress > 0.9 ? (1 - p.progress) * 10 : 1;
    ctx.fillStyle = ratioColor(p.source.ratio, p.alpha * fade);
    ctx.beginPath();
    ctx.arc(x, y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }

  // Nodes
  const time = Date.now() * 0.001;
  for (const n of activeNodes) {
    // Birth fade-in
    const age = (Date.now() - n.birthTime) / 1000;
    const birthAlpha = Math.min(1, age / 1.5);

    // Ambient pulse
    const pulse = n.radius > 2 ? 1 + Math.sin(time * 1.5 + n.x * 0.01) * 0.06 : 1;

    if (n.radius > 3) {
      // Glow — only for significant nodes
      const glowR = n.radius * 2.5;
      const grad = ctx.createRadialGradient(n.x, n.y, n.radius * 0.3, n.x, n.y, glowR);
      grad.addColorStop(0, ratioColor(n.ratio, 0.2 * birthAlpha));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(n.x, n.y, glowR, 0, Math.PI * 2);
      ctx.fill();

      // Core
      ctx.fillStyle = ratioColor(n.ratio, (0.6 + Math.sin(time * 2 + n.y * 0.01) * 0.1) * birthAlpha);
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius * pulse, 0, Math.PI * 2);
      ctx.fill();

      // Bright center
      ctx.fillStyle = ratioColor(n.ratio, 0.9 * birthAlpha);
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius * 0.4 * pulse, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Dust particles — simple dot, no glow
      ctx.fillStyle = ratioColor(n.ratio, (0.35 + n.radius * 0.15) * birthAlpha);
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    // Sunnie marker — bright ring
    if (n.name === 'Sunnie') {
      ctx.strokeStyle = `rgba(255,220,100,${0.7 * birthAlpha})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius * pulse + 4, 0, Math.PI * 2);
      ctx.stroke();
      // second faint outer ring
      ctx.strokeStyle = `rgba(255,220,100,${0.2 * birthAlpha})`;
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius * pulse + 9, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Labels — top nodes always, all nodes when zoomed in
    const zoomLabelThreshold = 2 / cam.zoom; // at zoom 1: show radius>2, at zoom 3: show radius>0.67
    if ((n._showLabel || (cam.zoom > 1.5 && n.radius * cam.zoom > zoomLabelThreshold)) && cam.zoom > 0.35) {
      const fontSize = Math.max(8, Math.min(14, n.radius * 0.8 + cam.zoom * 2));
      ctx.fillStyle = `rgba(255,220,160,${(n._showLabel ? 0.55 : 0.4) * birthAlpha})`;
      ctx.font = `${fontSize}px monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(n.name, n.x, n.y - n.radius - 4);
    }
  }
}

// === INTERACTION ===
let hoveredNode = null;
let dragNode = null;
let lastMouse = { x: 0, y: 0 };
let isPanning = false;

canvas.addEventListener('mousemove', (e) => {
  const world = screenToWorld(e.clientX, e.clientY);

  if (dragNode) {
    dragNode.x = world.x;
    dragNode.y = world.y;
    dragNode.vx = 0; dragNode.vy = 0;
    lastMouse = { x: e.clientX, y: e.clientY };
    return;
  }

  if (isPanning) {
    cam.x += (e.clientX - lastMouse.x) / cam.zoom;
    cam.y += (e.clientY - lastMouse.y) / cam.zoom;
    lastMouse = { x: e.clientX, y: e.clientY };
    return;
  }

  // Hit test
  hoveredNode = null;
  for (const n of activeNodes) {
    const dx = world.x - n.x;
    const dy = world.y - n.y;
    if (dx * dx + dy * dy < (n.radius + 5) * (n.radius + 5)) {
      hoveredNode = n;
      break;
    }
  }

  if (hoveredNode) {
    const n = hoveredNode;
    const roleClass = n.ratio < -0.3 ? 'giver' : n.ratio > 0.3 ? 'receiver' : 'balanced';
    const role = n.ratio < -0.3 ? 'Net Giver' : n.ratio > 0.3 ? 'Net Receiver' : 'Balanced';
    tooltip.innerHTML = `
      <div class="name ${roleClass}">${n.name}</div>
      <div class="stat">${role} · ${n.edgeCount} connections</div>
      <div>Given: <span class="giver">${(n.given/100000000).toFixed(2)} BSV</span></div>
      <div>Received: <span class="receiver">${(n.received/100000000).toFixed(2)} BSV</span></div>
      <div class="stat">Total activity: ${((n.given+n.received)/100000000).toFixed(2)} BSV</div>
    `;
    tooltip.style.display = 'block';
    tooltip.style.left = Math.min(e.clientX + 15, W - 310) + 'px';
    tooltip.style.top = Math.min(e.clientY - 10, H - 150) + 'px';
    canvas.style.cursor = 'grab';
  } else {
    tooltip.style.display = 'none';
    canvas.style.cursor = 'default';
  }
});

canvas.addEventListener('mousedown', (e) => {
  const world = screenToWorld(e.clientX, e.clientY);
  for (const n of activeNodes) {
    const dx = world.x - n.x;
    const dy = world.y - n.y;
    if (dx * dx + dy * dy < (n.radius + 5) * (n.radius + 5)) {
      dragNode = n;
      n.dragging = true;
      canvas.style.cursor = 'grabbing';
      return;
    }
  }
  isPanning = true;
  lastMouse = { x: e.clientX, y: e.clientY };
});

canvas.addEventListener('mouseup', () => {
  if (dragNode) {
    dragNode.dragging = false;
    dragNode.pinned = true; // stays pinned until double-clicked
    dragNode = null;
    canvas.style.cursor = 'default';
  }
  isPanning = false;
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.92 : 1.08;
  cam.zoom = Math.max(0.15, Math.min(5, cam.zoom * factor));
}, { passive: false });

// Double-click: unpin node if on one, else reset camera
canvas.addEventListener('dblclick', (e) => {
  const world = screenToWorld(e.clientX, e.clientY);
  for (const n of activeNodes) {
    const dx = world.x - n.x;
    const dy = world.y - n.y;
    if (dx * dx + dy * dy < (n.radius + 5) * (n.radius + 5)) {
      n.pinned = false;
      return;
    }
  }
  cam = { x: 0, y: 0, zoom: 1 };
});

// === TIMELINE CONTROLS ===
const slider = document.getElementById('date-slider');
const playBtn = document.getElementById('play-btn');
const satsSlider = document.getElementById('sats-slider');

slider.addEventListener('input', () => {
  const t = slider.value / 1000;
  currentDate = DATE_START + t * DATE_RANGE;
  recompute();
});

playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
  if (playing && currentDate >= DATE_END - 86400000) {
    currentDate = DATE_START;
    slider.value = 0;
  }
});

satsSlider.addEventListener('input', () => {
  minSats = SATS_LEVELS[satsSlider.value];
  document.getElementById('sats-val').textContent = SATS_LABELS[satsSlider.value];
  recompute();
});

const speedSlider = document.getElementById('speed-slider');
speedSlider.addEventListener('input', () => {
  playSpeed = SPEED_LEVELS[speedSlider.value];
  document.getElementById('speed-val').textContent = SPEED_LABELS[speedSlider.value];
});

// Month labels on timeline
function buildMonthLabels() {
  const container = document.getElementById('month-labels');
  const months = [];
  let d = new Date('2024-11-01');
  const end = new Date('2026-04-01');
  const names = ['N','D','J','F','M','A','M','J','J','A','S','O','N','D','J','F','M','A'];
  while (d < end) {
    const t = (d.getTime() - DATE_START) / DATE_RANGE;
    if (t >= 0 && t <= 1) {
      months.push({ t, label: names[months.length] || '' });
    }
    d.setUTCMonth(d.getUTCMonth() + 1);
  }
  container.innerHTML = months.map(m =>
    `<span style="position:relative;left:${m.t * 100}%">${m.label}</span>`
  ).join('');
}
buildMonthLabels();

// === TITLE FADE ===
setTimeout(() => {
  const t = document.getElementById('title-overlay');
  if (t) t.style.opacity = '0';
  setTimeout(() => { if (t) t.remove(); }, 2500);
}, 4000);

// === MAIN LOOP ===
let lastTime = 0;
let frameCount = 0;

function loop(timestamp) {
  requestAnimationFrame(loop);
  
  // Throttle simulation for performance
  const frameDelta = timestamp - lastTime;
  if (frameDelta < 16) return;
  lastTime = timestamp;

  // Auto-play — time-based, independent of frame rate
  if (playing) {
    const elapsedSec = frameDelta / 1000;
    const daysPerSecond = playSpeed * 10; // 1x = 10 days/sec (~50s full), 0.1x = 1 day/sec (~8min)
    const advance = daysPerSecond * elapsedSec * 86400000;
    currentDate = Math.min(currentDate + advance, DATE_END);
    slider.value = ((currentDate - DATE_START) / DATE_RANGE) * 1000;

    if (currentDate >= DATE_END) {
      playing = false;
      playBtn.innerHTML = '&#9654;';
    }

    // Recompute every few frames during playback for performance
    if (frameCount % 3 === 0) recompute();
  }

  simulate();

  // Spawn particles
  const targetParticles = Math.min(MAX_PARTICLES, activeEdges.length);
  while (particles.length < targetParticles) {
    spawnParticle();
    if (particles.length % 30 === 0) break; // spawn up to 30 per frame to fill quickly
  }

  draw();
  frameCount++;
}

// Initial setup — sync all state from actual slider positions (browser may restore them)
minSats = SATS_LEVELS[satsSlider.value];
document.getElementById('sats-val').textContent = SATS_LABELS[satsSlider.value];
playSpeed = SPEED_LEVELS[speedSlider.value];
document.getElementById('speed-val').textContent = SPEED_LABELS[speedSlider.value];
currentDate = DATE_START + (slider.value / 1000) * DATE_RANGE;
recompute();
requestAnimationFrame(loop);

</script>
